<!DOCTYPE html>
<html>

<head>
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

    <script>
        (() => {
            const saved =
                localStorage.getItem(
                    "expense-manager-theme"
                );

            const theme =
                saved === "light" ||
                saved === "dark"
                    ? saved
                    : (
                        window.matchMedia(
                            "(prefers-color-scheme: light)"
                        ).matches
                            ? "light"
                            : "dark"
                    );

            document.documentElement.setAttribute(
                "data-theme",
                theme
            );
        })();
    </script>

    <title>Split Groups</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0b0b0b">
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='theme.css') }}">

    <script
        src="{{ url_for('static', filename='js/theme.js') }}"
        defer>
    </script>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='language.css') }}">

    <script
        src="{{ url_for('static', filename='js/language.js') }}"
        defer>
    </script>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='mobile.css') }}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>👥 Split Expense Groups</h1>

        <p>
            <a href="/">Dashboard</a> |
            <a href="/groups">Split Groups</a>
        </p>

    </div>

    <div class="card">

        <h2>Create Group</h2>

        <form action="/add_group" method="POST">

            <input
                type="text"
                name="group_name"
                placeholder="Group Name"
                required>

            <button type="submit">
                Create Group
            </button>

        </form>

    </div>

    <div class="card">

        <h2>Groups</h2>

        <table>

            <tr>
                <th>ID</th>
                <th>Group Name</th>
                <th>Open</th>
                <th>Delete</th>
            </tr>

            {% for group in groups %}

            <tr>

                <td>{{ group[0] }}</td>

                <td>{{ group[1] }}</td>

                <td>

                    <a href="/group/{{ group[0] }}">
                        Open
                    </a>

                </td>

                <td>

                    <a
                    href="/delete_group/{{ group[0] }}"
                    onclick="return confirm('Delete this group and all its data?')">

                        ❌ Delete

                    </a>

                </td>

            </tr>

            {% endfor %}

        </table>

    </div>

</div>

    <script src="/static/js/db.js"></script>
    <script src="/static/js/sync.js"></script>
    <script src="/static/js/offline.js"></script>
</body>
</html>
