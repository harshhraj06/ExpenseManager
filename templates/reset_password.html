<!DOCTYPE html>
<html>

<head>
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

    <script>
        (() => {
            const saved =
                localStorage.getItem(
                    "expense-manager-theme"
                );

            const theme =
                saved === "light" ||
                saved === "dark"
                    ? saved
                    : (
                        window.matchMedia(
                            "(prefers-color-scheme: light)"
                        ).matches
                            ? "light"
                            : "dark"
                    );

            document.documentElement.setAttribute(
                "data-theme",
                theme
            );
        })();
    </script>

    <title>Reset Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0b0b0b">
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='theme.css') }}">

    <script
        src="{{ url_for('static', filename='js/theme.js') }}"
        defer>
    </script>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='language.css') }}">

    <script
        src="{{ url_for('static', filename='js/language.js') }}"
        defer>
    </script>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='mobile.css') }}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>🔑 Reset Password</h1>

        {% if error %}
        <p style="color:#dc2626;">{{ error }}</p>
        {% endif %}

        {% if not expired %}

        <form action="/reset_password/{{ token }}" method="POST">

            <div class="password-field">

                <input
                    type="password"
                    name="password"
                    id="new-password"
                    placeholder="New Password"
                    required>

                <span
                    class="password-toggle"
                    onclick="togglePassword('new-password', this)">
                    👁️
                </span>

            </div>

            <div class="password-field">

                <input
                    type="password"
                    name="confirm_password"
                    id="confirm-password"
                    placeholder="Confirm New Password"
                    required>

                <span
                    class="password-toggle"
                    onclick="togglePassword('confirm-password', this)">
                    👁️
                </span>

            </div>

            <button type="submit">
                Reset Password
            </button>

        </form>

        {% else %}

        <p>
            <a href="/forgot_password">Request a new reset link</a>
        </p>

        {% endif %}

        <p>
            <a href="/login">← Back to Login</a>
        </p>

    </div>

</div>

<script>
function togglePassword(inputId, iconEl) {
    const input = document.getElementById(inputId);
    if (input.type === "password") {
        input.type = "text";
        iconEl.textContent = "🙈";
    } else {
        input.type = "password";
        iconEl.textContent = "👁️";
    }
}
</script>

    <script src="/static/js/db.js"></script>
    <script src="/static/js/sync.js"></script>
    <script src="/static/js/offline.js"></script>
</body>
</html>
