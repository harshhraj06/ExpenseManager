<!DOCTYPE html>
<html>

<head>
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

    <script>
        (() => {
            const saved =
                localStorage.getItem(
                    "expense-manager-theme"
                );

            const theme =
                saved === "light" ||
                saved === "dark"
                    ? saved
                    : (
                        window.matchMedia(
                            "(prefers-color-scheme: light)"
                        ).matches
                            ? "light"
                            : "dark"
                    );

            document.documentElement.setAttribute(
                "data-theme",
                theme
            );
        })();
    </script>


<title>Edit Expense</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">

    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0b0b0b">
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='theme.css') }}">

    <script
        src="{{ url_for('static', filename='js/theme.js') }}"
        defer>
    </script>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='language.css') }}">

    <script
        src="{{ url_for('static', filename='js/language.js') }}"
        defer>
    </script>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='mobile.css') }}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>✏️ Edit Shared Expense</h1>

        {% if request.args.get('split_error') == 'no_members' %}
        <p>Please choose at least one person before saving the split.</p>
        {% endif %}

        <form
        action="/update_shared_expense/{{ expense[0] }}"
        method="POST">

            <input
                type="hidden"
                name="group_id"
                value="{{ expense[1] }}">

            <input
                type="text"
                name="description"
                value="{{ expense[2] }}"
                required>

            <input
                type="number"
                step="0.01"
                name="amount"
                value="{{ expense[3] }}"
                required>

            <select name="paid_by">

                {% for member in members %}

                <option
                {% if member[2] == expense[4] %}
                selected
                {% endif %}
                >
                    {{ member[2] }}
                </option>

                {% endfor %}

            </select>

            <div class="split-member-list">
                <h3>Split Between</h3>

                {% for member in members %}
                <label class="split-member-option">
                    <input
                        type="checkbox"
                        name="split_members"
                        value="{{ member[2] }}"
                        {% if member[2] in selected_split_members %}checked{% endif %}>
                    <span>{{ member[2] }}</span>
                </label>
                {% endfor %}
            </div>

            <button type="submit">
                Update Expense
            </button>

        </form>

    </div>

</div>

    <script src="/static/js/db.js"></script>
    <script src="/static/js/sync.js"></script>
    <script src="/static/js/offline.js"></script>
</body>
</html>
