<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Expense Manager</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .offline-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .offline-card {
      max-width: 520px;
      width: 100%;
      text-align: center;
      padding: 42px 28px;
      border-radius: 24px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
    }

    .offline-card img {
      width: 82px;
      height: 82px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    .offline-card h1 {
      margin-bottom: 12px;
    }

    .offline-card p {
      opacity: .7;
      line-height: 1.6;
    }

    .offline-card button {
      margin-top: 20px;
      padding: 12px 22px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0b0b0b">
</head>
<body>
  <main class="offline-page">
    <section class="offline-card">
      <img src="/static/logo.png" alt="Expense Manager">
      <h1>You're offline</h1>
      <p>
        Expense Manager is available offline for locally stored data.
        Reconnect to sync your pending changes.
      </p>
      <button onclick="location.reload()">Try Again</button>
    </section>
  </main>
    <script src="/static/js/db.js"></script>
    <script src="/static/js/sync.js"></script>
    <script src="/static/js/offline.js"></script>
</body>
</html>
