<!DOCTYPE html>
<html>

<head>
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

    <script>
        (() => {
            const saved =
                localStorage.getItem(
                    "expense-manager-theme"
                );

            const theme =
                saved === "light" ||
                saved === "dark"
                    ? saved
                    : (
                        window.matchMedia(
                            "(prefers-color-scheme: light)"
                        ).matches
                            ? "light"
                            : "dark"
                    );

            document.documentElement.setAttribute(
                "data-theme",
                theme
            );
        })();
    </script>

    <title>Forgot Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0b0b0b">
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='theme.css') }}">

    <script
        src="{{ url_for('static', filename='js/theme.js') }}"
        defer>
    </script>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='language.css') }}">

    <script
        src="{{ url_for('static', filename='js/language.js') }}"
        defer>
    </script>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='mobile.css') }}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>🔑 Forgot Password</h1>

        {% if message %}
        <p style="color:#16a34a;">{{ message }}</p>
        {% endif %}

        {% if error %}
        <p style="color:#dc2626;">{{ error }}</p>
        {% endif %}

        {% if not message %}

        <p>Enter your account email and we'll send you a link to reset your password.</p>

        <form action="/forgot_password" method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email"
                required>

            <button type="submit">
                Send Reset Link
            </button>

        </form>

        {% endif %}

        <p>
            <a href="/login">← Back to Login</a>
        </p>

    </div>

</div>

    <script src="/static/js/db.js"></script>
    <script src="/static/js/sync.js"></script>
    <script src="/static/js/offline.js"></script>
</body>
</html>
